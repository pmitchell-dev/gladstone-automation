# ==========================================================
# GLADSTONE LOG VIEWER STACK (Webhost — 192.168.50.217)
# ==========================================================
# Deploy:  cd /home/pi/dozzle && docker compose up -d
# UI:      http://192.168.50.217:8888
# ==========================================================

services:

  # ── Main Dozzle Instance ──────────────────────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_HOSTNAME: "Webhost (192.168.50.217)"
      DOZZLE_REMOTE_AGENT: "192.168.50.138:7007"
      # DOZZLE_USERNAME: admin
      # DOZZLE_PASSWORD: changeme

  # ── Webhost Script Log Bridge ─────────────────────────
  # Tails Gladstone script logs written on the webhost itself.
  webhost-scripts-log:
    image: debian:bookworm-slim
    container_name: webhost-scripts-log
    restart: unless-stopped
    volumes:
      - /home/pi/scripts/logs:/logs
    entrypoint: ["bash", "-c", "mkdir -p /logs && touch /logs/rebuild.log /logs/pi_services_manager.log /logs/pi_backup.log && echo '📋 [Webhost] Script log stream starting...' && tail -f /logs/rebuild.log /logs/pi_services_manager.log /logs/pi_backup.log"]
    labels:
      dozzle.name: "Webhost Scripts"

  # ── NVR Syslog Receiver ───────────────────────────────
  # Listens on UDP 514 for syslog from the ANNKE NVR.
  # ANNKE config: Network > Log Server Settings
  #   Log Server Address = 192.168.50.217
  #   Log Server Port    = 514
  # Uses Python3 for unambiguous UDP socket binding
  # (netcat-openbsd -p flag does not set listen port).
  nvr-syslog:
    image: python:3.11-slim
    container_name: nvr-syslog
    restart: unless-stopped
    ports:
      - "514:514/udp"
    entrypoint: ["python3", "-c", "import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1); s.bind(('0.0.0.0',514)); print('[NVR Syslog] Listening on UDP 514...',flush=True)\nwhile True: d,a=s.recvfrom(65535); print('['+a[0]+'] '+d.decode('utf-8','replace'),flush=True)"]
    labels:
      dozzle.name: "ANNKE NVR Syslog"

networks:
  default:
    name: dozzle_network
