# ==========================================================
# GLADSTONE LOG VIEWER STACK (Webhost — 192.168.50.217)
# ==========================================================
# Deploy:  cd /home/pi/dozzle && docker compose up -d
# UI:      http://192.168.50.217:8888
# ==========================================================

services:

  # ── Main Dozzle Instance ──────────────────────────────
  # Reads all local Docker container logs via the socket,
  # and connects to the Pi5 agent for hub-side logs.
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_HOSTNAME: "Webhost (192.168.50.217)"
      # Connect to Dozzle Agent on the Pi5 (ntfy hub)
      DOZZLE_REMOTE_AGENT: "192.168.50.138:7007"
      # Optional: uncomment to enable basic auth
      # DOZZLE_USERNAME: admin
      # DOZZLE_PASSWORD: changeme

  # ── Pi5 Script Log Bridge ─────────────────────────────
  # Tails all Pi5 Gladstone script logs in real-time.
  # These are mounted from the host filesystem via volume.
  # The Pi5 scripts log to: /home/pi/scripts/logs/
  gladstone-scripts-log:
    image: alpine:3.19
    container_name: gladstone-scripts-log
    restart: unless-stopped
    # NOTE: This sidecar runs on the Pi5 (via the Dozzle agent),
    # not directly here. See the agent-compose.yml for the Pi5 side.
    # This entry is a placeholder/documentation reminder.
    # The actual sidecar is defined in dozzle-agent-compose.yml.
    entrypoint: ["echo", "See dozzle-agent-compose.yml on Pi5 for script log bridge"]

  # ── NVR Syslog Receiver ───────────────────────────────
  # Listens on UDP 514 for syslog messages from the ANNKE NVR.
  # Configure your ANNKE NVR: Menu > Network > Alarm Host
  #   Alarm Host IP  = 192.168.50.217  (this machine)
  #   Alarm Host Port = 514
  # If ANNKE does not support syslog forwarding, logs from
  # the NVR web UI must be checked manually. This container
  # will log "Waiting for NVR syslog..." until traffic arrives.
  nvr-syslog:
    image: alpine:3.19
    container_name: nvr-syslog
    restart: unless-stopped
    ports:
      - "514:514/udp"
    entrypoint: >
      sh -c "
        apk add --no-cache socat &&
        echo '📡 [NVR Syslog] Listening on UDP 514 for ANNKE NVR logs...' &&
        socat -u UDP-RECV:514 STDOUT
      "
    labels:
      dozzle.name: "ANNKE NVR Syslog"

networks:
  default:
    name: dozzle_network
