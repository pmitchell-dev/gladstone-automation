# ==========================================================
# GLADSTONE LOG VIEWER STACK (Webhost — 192.168.50.217)
# ==========================================================
# Deploy:  cd ~/dozzle && docker compose up -d --remove-orphans
# UI:      http://192.168.50.217:8888
# ==========================================================

services:

  # ── Main Dozzle Instance ──────────────────────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_HOSTNAME: "Webhost (192.168.50.217)"
      DOZZLE_REMOTE_AGENT: "192.168.50.138:7007"
      # DOZZLE_USERNAME: admin
      # DOZZLE_PASSWORD: changeme

  # ── Webhost Script Log Bridge ─────────────────────────
  # Tails Gladstone script logs written on the webhost itself.
  webhost-scripts-log:
    image: debian:bookworm-slim
    container_name: webhost-scripts-log
    restart: unless-stopped
    volumes:
      - ${HOME:-/home/pi}/scripts/logs:/logs
    entrypoint: ["bash", "-c", "mkdir -p /logs && touch /logs/rebuild.log /logs/services_manager.log /logs/backup.log && echo '📋 [Webhost] Script log stream starting...' && tail -f /logs/rebuild.log /logs/services_manager.log /logs/backup.log"]
    labels:
      dozzle.name: "Webhost Scripts"

  # ── NVR Syslog Receiver ───────────────────────────────
  # Listens on UDP 514 for syslog from the ANNKE NVR.
  # ANNKE config: Network > Log Server Settings
  #   Log Server Address = 192.168.50.217
  #   Log Server Port    = 514
  # Uses Python3 for unambiguous UDP socket binding
  # (netcat-openbsd -p flag does not set listen port).
  nvr-syslog:
    image: python:3.11-slim
    container_name: nvr-syslog
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ${HOME:-/home/pi}/scripts/nvr_syslog.py:/nvr_syslog.py:ro
    entrypoint: ["python3", "-u", "/nvr_syslog.py"]
    labels:
      dozzle.name: "ANNKE NVR Syslog"

networks:
  default:
    name: dozzle_network
