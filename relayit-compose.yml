version: '3.8'

services:
  db:
    image: postgres:16
    container_name: relayit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-relayit}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-relayit}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: relayit-web:latest
    container_name: relayit-web
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-relayit}
      SECRET_KEY: ${SECRET_KEY:-change_this_to_a_secure_random_string}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

  caddy:
    image: caddy:2-alpine
    container_name: relayit-caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
    depends_on:
      - web
