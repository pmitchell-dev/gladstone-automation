services:
  jobboard:
    build: .
    container_name: jobboard
    ports:
      # Host port 3001 — Invidious already occupies 3000
      - "3001:3000"
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    # Run as host pi user (1000:1000) so the process can write to
    # the volume-mounted data/ and cache/ directories
    user: "1000:1000"
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
