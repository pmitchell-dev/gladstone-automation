# ==========================================================
# GLADSTONE GEMINI API BACKEND STACK (Webhost — 192.168.50.217:5050)
# ==========================================================
# Deploy:  cd ~/gemini-api && docker compose up -d --build
# Endpoint: http://192.168.50.217:5050/api/query
# ==========================================================

services:
  gemini-api:
    build:
      context: .
      dockerfile: Dockerfile.gemini
    container_name: gemini-api
    restart: unless-stopped
    ports:
      - "5050:5050"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_DEFAULT_MODEL=${GEMINI_DEFAULT_MODEL:-gemini-3.7-flash}
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-gemini-3.6-flash}
      - GEMINI_MAX_RETRIES=${GEMINI_MAX_RETRIES:-5}
