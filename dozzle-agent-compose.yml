# ==========================================================
# GLADSTONE DOZZLE AGENT (Pi5 Hub — 192.168.50.138)
# ==========================================================
# Deploy:  cd ~/dozzle && docker compose up -d --remove-orphans
# This exposes Pi5 Docker logs to the Webhost Dozzle instance.
# Port 7007 must be reachable from 192.168.50.217.
# ==========================================================

services:

  # ── Dozzle Agent ──────────────────────────────────────
  # Securely exposes this host's Docker logs to the
  # main Dozzle instance on the Webhost.
  dozzle-agent:
    image: amir20/dozzle:latest
    container_name: dozzle-agent
    restart: unless-stopped
    command: agent
    ports:
      - "7007:7007"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_HOSTNAME: "Pi5 Hub (192.168.50.138)"

  # ── Gladstone Script Log Bridge ───────────────────────
  # Tails all Pi5 Gladstone script logs to stdout so Dozzle
  # can stream them in real-time alongside container logs.
  gladstone-scripts-log:
    image: debian:bookworm-slim
    container_name: gladstone-scripts-log
    restart: unless-stopped
    volumes:
      - ${HOME:-/home/pi}/scripts/logs:/logs
    entrypoint: ["bash", "-c", "mkdir -p /logs && touch /logs/ntfy.log /logs/rebuild.log /logs/net_speed.log /logs/ntfy_listener.log /logs/pi_services_manager.log /logs/pi_backup.log && echo '📋 [Gladstone] Script log stream starting...' && tail -f /logs/ntfy.log /logs/rebuild.log /logs/net_speed.log /logs/ntfy_listener.log /logs/pi_services_manager.log /logs/pi_backup.log"]
    labels:
      dozzle.name: "Gladstone Pi5 Scripts"
