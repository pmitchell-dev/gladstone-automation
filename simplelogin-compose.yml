# ==========================================================
# GLADSTONE SIMPLELOGIN STACK (Pi5 Hub — localrepo.net)
# ARM64 / AMD64 Multi-Arch Self-Hosted Stack
# ==========================================================
# Deploy:  cd ~/simplelogin && docker compose up -d --remove-orphans
# Endpoint: http://simplelogin.localrepo.net:7777 (or http://192.168.50.138:7777)
# Domain:   localrepo.net
# ==========================================================

services:

  # ── SimpleLogin Multi-Arch Application Engine ─────────────
  simplelogin-app:
    image: ghcr.io/infinityofspace/simplelogin-docker-aio:latest
    container_name: simplelogin-app
    restart: unless-stopped
    ports:
      - "7777:7777"
      - "25:25"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=simplelogin
      - POSTGRES_PASSWORD=sl_password_secret
      - POSTGRES_DB=simplelogin
      - HOSTNAME=simplelogin.localrepo.net
      - EMAIL_DOMAIN=localrepo.net
      - URL=http://simplelogin.localrepo.net:7777
      - DB_URI=postgresql://simplelogin:sl_password_secret@db:5432/simplelogin
      - FLASK_SECRET=sl_flask_secret_key_change_in_prod
      - SUPPORT_EMAIL=support@localrepo.net
      - ADMIN_EMAIL=admin@localrepo.net
    volumes:
      - ./data/sl:/sl
      - ./data/upload:/code/static/upload
    depends_on:
      - db

  # ── SimpleLogin PostgreSQL Database ───────────────────────
  db:
    image: postgres:16-alpine
    container_name: simplelogin-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=simplelogin
      - POSTGRES_PASSWORD=sl_password_secret
      - POSTGRES_DB=simplelogin
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
