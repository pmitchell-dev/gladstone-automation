# ==========================================================
# GLADSTONE SIMPLELOGIN STACK (Pi5 Hub — 192.168.50.138:7777)
# ==========================================================
# Deploy:  cd ~/simplelogin && docker compose up -d --remove-orphans
# Endpoint: http://192.168.50.138:7777
# ==========================================================

services:

  # ── SimpleLogin Web Application & API Server ─────────────
  sl-app:
    image: simplelogin/app-ci:latest
    container_name: simplelogin-app
    restart: unless-stopped
    ports:
      - "7777:7777"
    environment:
      - URL=http://192.168.50.138:7777
      - EMAIL_DOMAIN=simplelogin.local
      - DB_URI=postgresql://simplelogin:sl_password_secret@sl-db:5432/simplelogin
      - FLASK_SECRET=sl_flask_secret_key_change_in_prod
      - SUPPORT_EMAIL=support@simplelogin.local
      - ADMIN_EMAIL=admin@simplelogin.local
      - POSTFIX_SERVER=sl-postfix
    depends_on:
      - sl-db

  # ── SimpleLogin PostgreSQL Database ───────────────────────
  sl-db:
    image: postgres:16-alpine
    container_name: simplelogin-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=simplelogin
      - POSTGRES_PASSWORD=sl_password_secret
      - POSTGRES_DB=simplelogin
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data

  # ── SimpleLogin Postfix Mail Server Engine ────────────────
  sl-postfix:
    image: simplelogin/postfix:latest
    container_name: simplelogin-postfix
    restart: unless-stopped
    environment:
      - DB_HOST=sl-db
      - DB_USER=simplelogin
      - DB_PASSWORD=sl_password_secret
      - DB_NAME=simplelogin
      - POSTFIX_FQDN=mail.simplelogin.local
      - ALIASES_DEFAULT_DOMAIN=simplelogin.local
    ports:
      - "25:25"
    depends_on:
      - sl-db
